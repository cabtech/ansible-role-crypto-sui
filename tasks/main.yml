---
# --------------------------------

- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-sui"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-sui"]

- name: "Install pre-requisites"
  ansible.builtin.apt:
    name: "{{ sui_pkg_dependencies }}"
    state: present
    update_cache: true
  become: true
  tags: ["ct-sui"]

- name: "Add runtime user"
  ansible.builtin.user:
    name: "{{ sui_username }}"
    shell: /bin/bash
  become: true
  tags: ["ct-sui"]

- name: "Create directories"
  ansible.builtin.file:
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    name: "{{ item.path }}"
    owner: "{{ item.owner }}"
    state: directory
  loop: "{{ sui_directories }}"
  become: true
  tags: ["ct-sui"]

